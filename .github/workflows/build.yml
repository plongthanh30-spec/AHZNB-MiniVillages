name: Build AHZNB MiniVillages

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      # ForgeGradle 2.3 for Minecraft 1.12.2 is an old build setup.
      # Use Gradle 4.10.3 instead of the runner's current Gradle 9.x.
      - name: Set up Gradle 4.10.3
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: '4.10.3'

      - name: Build mod
        run: gradle build --no-daemon

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AHZNB-MiniVillages
          path: build/libs/*.jar
          if-no-files-found: error
